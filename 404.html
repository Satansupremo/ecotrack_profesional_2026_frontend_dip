<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Ecotrack | Página no encontrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>

<body class="min-vh-100 d-flex flex-column bg-light">
    <header class="bg-white border-bottom shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark text-decoration-none" href="/index.html">
                <span class="text-danger me-2" aria-hidden="true">♻</span>
                Ecotrack
            </a>
        </div>
    </header>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-9 col-lg-7">
                    <section class="card border-0 shadow-sm rounded-4 text-center">
                        <div class="card-body p-4 p-md-5">
                            <span class="display-2 text-danger" aria-hidden="true">
                                <i class="bi bi-signpost-split"></i>
                            </span>
                            <p class="text-uppercase text-secondary small fw-bold mt-3 mb-2">Error 404</p>
                            <h1 class="h2 fw-bold">No encontramos esta página</h1>
                            <p class="text-secondary mt-3 mb-4">
                                El enlace puede estar escrito incorrectamente o la página ya no existe.
                            </p>

                            <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                                <button type="button" class="btn btn-outline-secondary" id="btn-volver">
                                    <i class="bi bi-arrow-left me-1"></i>
                                    Volver
                                </button>
                                <a href="/index.html" class="btn btn-danger">
                                    <i class="bi bi-house-door me-1"></i>
                                    Ir al inicio
                                </a>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-secondary small py-3">
        Ecotrack · Gestión sostenible de recursos
    </footer>

    <script>
        document.getElementById("btn-volver").addEventListener("click", () => {
            if (document.referrer.startsWith(window.location.origin)) {
                window.history.back();
                return;
            }

            window.location.href = "/index.html";
        });
    </script>
</body>

</html>
