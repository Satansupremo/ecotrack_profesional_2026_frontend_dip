
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar programaciones ejecutadas | EcoTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <div id="site-header"></div>

    <main class="container py-4">

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h2 class="mb-1">Gestionar programaciones ejecutadas</h2>
                <p class="text-muted mb-0">
                    Consulta las programaciones en ejecución y registra las cargas recibidas.
                </p>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">

                <div class="row align-items-end g-3 mb-4">
                    <div class="col-md-6">
                        <label for="buscarProgramacion" class="form-label">
                            Buscar programación
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-search"></i>
                            </span>
                            <input
                                type="number"
                                class="form-control"
                                id="buscarProgramacion"
                                placeholder="Ingrese el código de programación"
                                min="1"
                            >
                        </div>
                    </div>

                    <div class="col-md-auto">
                        <button class="btn btn-outline-secondary" id="btnLimpiarBusqueda">
                            <i class="bi bi-x-circle"></i>
                            Limpiar
                        </button>
                    </div>
                </div>

                <div id="mensaje" class="mb-3"></div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Programaciones</h5>
                    <span class="text-muted small" id="totalProgramaciones">
                        Total: 0
                    </span>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Código</th>
                                <th>Solicitud</th>
                                <th>Ubicación</th>
                                <th>Fecha de ejecución</th>
                                <th>Unidades</th>
                                <th>Salidas pendientes</th>
                                <th>Estado</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProgramaciones">
                            <tr>
                                <td colspan="8" class="text-center text-muted py-4">
                                    Cargando programaciones...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mt-3">
                    <span class="text-muted small" id="informacionPagina">
                        Página 0 de 0
                    </span>

                    <nav aria-label="Paginación de programaciones">
                        <ul class="pagination mb-0" id="paginacion"></ul>
                    </nav>
                </div>

            </div>
        </div>

    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/programacion/gestionarProgramacionesEjecutadas.js"></script>

</body>
</html>
