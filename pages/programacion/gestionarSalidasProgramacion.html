<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar salidas | EcoTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <div id="site-header"></div>

    <main class="container py-4">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h2 class="fw-bold mb-1">Gestionar salidas</h2>
                <p class="text-muted mb-0">
                    Consulta y administra las salidas de la programación seleccionada.
                </p>
            </div>

            <a href="/pages/programacion/gestionarProgramacionesEjecutadas.html" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>
                Volver
            </a>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <span class="text-muted small">Código de programación</span>
                        <h5 class="fw-bold mb-0" id="codigoProgramacion">-</h5>
                    </div>

                    <div class="col-md-3">
                        <span class="text-muted small">Total de salidas</span>
                        <h5 class="fw-bold mb-0" id="totalSalidas">0</h5>
                    </div>

                    <div class="col-md-3">
                        <span class="text-muted small">Pendientes de registro</span>
                        <h5 class="fw-bold mb-0" id="salidasPendientes">0</h5>
                    </div>

                    <div class="col-md-3">
                        <span class="text-muted small">Cargas en proceso</span>
                        <h5 class="fw-bold mb-0" id="cargasEnProceso">0</h5>
                    </div>
                </div>
            </div>
        </div>

        <div id="mensaje" class="alert d-none" role="alert"></div>

        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="fw-bold mb-0">
                    <i class="bi bi-truck text-danger me-2"></i>
                    Salidas registradas
                </h5>
            </div>

            <div class="card-body">

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Código</th>
                                <th>Transportista</th>
                                <th>Vehículo</th>
                                <th>Fecha de registro</th>
                                <th>Estado</th>
                                <th>Acción</th>
                            </tr>
                        </thead>

                        <tbody id="tablaSalidas">
                            <tr>
                                <td colspan="6" class="text-center py-4">
                                    Cargando salidas...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/programacion/gestionarSalidasProgramacion.js"></script>

</body>

</html>
