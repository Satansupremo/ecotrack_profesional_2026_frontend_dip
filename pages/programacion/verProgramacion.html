
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver programación | EcoTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="min-vh-100 d-flex flex-column">

    <div id="pantalla-carga">
        <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>

    <div id="site-header"></div>

    <main class="container py-5 flex-grow-1">

        <div class="mb-4">
            <span class="badge bg-danger-subtle text-danger mb-2">
                Gestión de programaciones
            </span>

            <h2 class="fw-bold text-dark mb-2">Ver programación</h2>

            <p class="text-secondary mb-0">
                Consulta la información y las recomendaciones de la programación seleccionada.
            </p>
        </div>

        <div id="mensaje-container"></div>

        <div class="card shadow-sm border-0 rounded-4 mb-4 overflow-hidden">
            <div class="card-header bg-white py-3 border-bottom-0">
                <h5 class="mb-0 fw-semibold text-dark">
                    <i class="bi bi-calendar-check text-danger me-2"></i>
                    Información de la programación
                </h5>
            </div>

            <div class="card-body p-4">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label text-secondary small mb-1">Código de programación</label>
                        <p class="fw-semibold mb-0" id="id-programacion">-</p>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-secondary small mb-1">Estado</label>
                        <p class="mb-0" id="estado-programacion">-</p>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-secondary small mb-1">Fecha de registro</label>
                        <p class="mb-0" id="fecha-registro-programacion">-</p>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-secondary small mb-1">Fecha de ejecución</label>
                        <p class="mb-0" id="fecha-ejecucion">-</p>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-secondary small mb-1">Jefe de unidad asignado</label>
                        <p class="fw-semibold mb-0" id="jefe-unidad">-</p>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-secondary small mb-1">Código de solicitud</label>
                        <p class="mb-0" id="id-solicitud">-</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 rounded-4 mb-4 overflow-hidden">
            <div class="card-header bg-white py-3 border-bottom-0">
                <h5 class="mb-0 fw-semibold text-dark">
                    <i class="bi bi-file-earmark-text text-danger me-2"></i>
                    Información de la solicitud
                </h5>
            </div>

            <div class="card-body p-4">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label text-secondary small mb-1">Título</label>
                        <p class="fw-semibold mb-0" id="titulo-solicitud">-</p>
                    </div>

                    <div class="col-12">
                        <label class="form-label text-secondary small mb-1">Descripción</label>
                        <p class="mb-0 text-secondary" id="descripcion-solicitud">-</p>
                    </div>

                    <div class="col-12">
                        <label class="form-label text-secondary small mb-1">Ubicación</label>
                        <p class="mb-0 text-secondary" id="ubicacion-solicitud">-</p>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-secondary small mb-1">Fecha de registro</label>
                        <p class="mb-0" id="fecha-registro-solicitud">-</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 rounded-4 mb-4 overflow-hidden">
            <div class="card-header bg-white py-3 border-bottom-0">
                <h5 class="mb-0 fw-semibold text-dark">
                    <i class="bi bi-clipboard-check text-danger me-2"></i>
                    Recomendaciones
                </h5>
            </div>

            <div class="card-body p-4">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label text-secondary small mb-1">Cantidad de unidades recomendadas</label>
                        <p class="fw-semibold mb-0" id="cantidad-unidades">-</p>
                    </div>

                    <div class="col-12">
                        <label class="form-label text-secondary small mb-1">Razón de la cantidad de unidades</label>
                        <p class="mb-0 text-secondary" id="razon-cantidad-unidades">-</p>
                    </div>

                    <div class="col-12">
                        <label class="form-label text-secondary small mb-1">Equipo de seguridad</label>
                        <p class="mb-0 text-secondary" id="equipo-seguridad">-</p>
                    </div>

                    <div class="col-12">
                        <label class="form-label text-secondary small mb-1">Otras recomendaciones</label>
                        <p class="mb-0 text-secondary" id="otras-recomendaciones">-</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end mt-3">
            <button type="button" class="btn btn-outline-secondary" id="volver">
                <i class="bi bi-arrow-left me-1"></i>
                Volver
            </button>
        </div>

    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/programacion/verProgramacion.js"></script>

</body>

</html>
