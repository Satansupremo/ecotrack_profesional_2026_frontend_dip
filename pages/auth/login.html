<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoTrack | Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="min-vh-100 d-flex flex-column bg-light">

    <div id="site-header"></div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">

                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-4 p-md-5">

                            <div class="text-center mb-3">
                                <span class="display-3 text-danger">
                                    <i class="bi bi-recycle"></i>
                                </span>
                            </div>

                            <h1 class="h3 fw-bold text-center mt-3">
                                Bienvenido a EcoTrack
                            </h1>

                            <p class="text-secondary text-center mb-4">
                                Inicia sesión para continuar
                            </p>

                            <div id="login-message" class="alert d-none" role="alert" aria-live="polite"></div>

                            <form id="login-form" novalidate>
                                <div class="mb-3">
                                    <label for="username" class="form-label">
                                        Nombre de usuario
                                    </label>

                                    <input type="text" class="form-control form-control-lg" id="username"
                                        name="username" placeholder="Ingresa tu nombre de usuario"
                                        autocomplete="username" required>

                                    <div class="invalid-feedback">
                                        Ingresa tu nombre de usuario.
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="password" class="form-label">
                                        Contraseña
                                    </label>

                                    <input type="password" class="form-control form-control-lg" id="password"
                                        name="password" placeholder="Ingresa tu contraseña"
                                        autocomplete="current-password" required>

                                    <div class="invalid-feedback">
                                        Ingresa tu contraseña.
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-danger btn-lg w-100" id="login-button">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>
                                    Iniciar sesión
                                </button>
                            </form>

                            <p class="text-center mt-4 mb-0">
                                ¿No tienes una cuenta?
                                <a href="/pages/auth/register.html" class="link-danger fw-semibold">
                                    Regístrate aquí
                                </a>
                            </p>

                            <div class="text-center mt-3">
                                <a href="/index.html" class="link-secondary text-decoration-none">
                                    <i class="bi bi-arrow-left me-1"></i>
                                    Volver al inicio
                                </a>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/login.js"></script>

</body>

</html>
