
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoTrack | Mis solicitudes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="min-vh-100 d-flex flex-column">

    <div id="pantalla-carga">
        <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>

        <p class="mt-3 text-secondary fw-semibold">
            Cargando...
        </p>
    </div>

    <div id="site-header"></div>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <section class="container">

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <div>
                    <span class="badge text-bg-danger mb-2">
                        Gestión de solicitudes
                    </span>

                    <h1 class="h2 fw-bold mb-1">Mis solicitudes</h1>

                    <p class="text-secondary mb-0">
                        Consulta y administra tus solicitudes de recuperación.
                    </p>
                </div>

                <a href="/pages/solicitud/registrarSolicitud.html" class="btn btn-danger">
                    <i class="bi bi-plus-circle me-2"></i>
                    Nueva solicitud
                </a>
            </div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="h5 fw-bold mb-1">Listado de solicitudes</h2>
                            <p class="text-secondary small mb-0">
                                Solicitudes registradas en EcoTrack.
                            </p>
                        </div>

                        <span class="badge text-bg-light border text-dark fs-6">
                            Total: <span id="total-solicitudes">0</span>
                        </span>
                    </div>

                    <div id="mensaje-container"></div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Código</th>
                                    <th>Título</th>
                                    <th>Fecha de registro</th>
                                    <th>Estado</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>

                            <tbody id="tabla-solicitudes">
                                <tr>
                                    <td colspan="5" class="text-center py-4 text-secondary">
                                        <div class="spinner-border spinner-border-sm text-danger me-2"></div>
                                        Cargando solicitudes...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mt-4">
                        <span id="informacion-paginacion" class="text-secondary small">
                            Página 0 de 0
                        </span>

                        <nav>
                            <ul class="pagination pagination-sm mb-0">
                                <li class="page-item">
                                    <button class="page-link" id="pagina-anterior">
                                        Anterior
                                    </button>
                                </li>

                                <li class="page-item">
                                    <button class="page-link" id="pagina-siguiente">
                                        Siguiente
                                    </button>
                                </li>
                            </ul>
                        </nav>
                    </div>

                </div>
            </div>

        </section>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/solicitud/gestionarMisSolicitudes.js"></script>

</body>
</html>
