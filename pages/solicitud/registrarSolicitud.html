
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoTrack | Registrar solicitud</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="min-vh-100 d-flex flex-column">

    <div id="pantalla-carga">
        <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>

        <p class="mt-3 text-secondary fw-semibold">
            Cargando...
        </p>
    </div>

    <div id="site-header"></div>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <section class="container">

            <div class="mb-4">
                <a href="/pages/solicitud/gestionarMisSolicitudes.html"
                   class="text-decoration-none text-secondary">
                    <i class="bi bi-arrow-left me-1"></i>
                    Volver a mis solicitudes
                </a>

                <div class="mt-3">
                    <span class="badge text-bg-danger mb-2">
                        Nueva solicitud
                    </span>

                    <h1 class="h2 fw-bold mb-1">Registrar solicitud</h1>

                    <p class="text-secondary mb-0">
                        Completa los datos para solicitar la recuperación de tus materiales.
                    </p>
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">

                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body p-4 p-md-5">

                            <div id="mensaje-container"></div>

                            <form id="form-solicitud" novalidate>

                                <div class="mb-4">
                                    <label for="titulo" class="form-label fw-semibold">
                                        Título
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control form-control-lg"
                                        id="titulo"
                                        name="titulo"
                                        maxlength="150"
                                        placeholder="Ej. Recolección de materiales reciclables"
                                        required>
                                </div>

                                <div class="mb-4">
                                    <label for="descripcion" class="form-label fw-semibold">
                                        Descripción
                                    </label>

                                    <textarea
                                        class="form-control"
                                        id="descripcion"
                                        name="descripcion"
                                        rows="4"
                                        placeholder="Describe los materiales que deseas recuperar..."
                                        required></textarea>
                                </div>

                                <div class="mb-4">
                                    <label for="ubicacion" class="form-label fw-semibold">
                                        Ubicación (Utilizar ubicación generada por Googlemaps)
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="ubicacion"
                                        name="ubicacion"
                                        placeholder="Ingresa la dirección de recolección"
                                        required>
                                </div>

                                <div class="d-flex flex-wrap justify-content-end gap-2 mt-4">
                                    <a href="/pages/solicitud/gestionarMisSolicitudes.html"
                                       class="btn btn-outline-secondary btn-accion-cancelar">
                                        Cancelar
                                    </a>

                                    <button type="submit" class="btn btn-danger btn-accion-registrar" id="btn-registrar">
                                        <i class="bi bi-check-circle me-2"></i>
                                        Registrar solicitud
                                    </button>
                                </div>

                            </form>

                        </div>
                    </div>

                </div>
            </div>

        </section>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/solicitud/registrarSolicitud.js"></script>

</body>
</html>
