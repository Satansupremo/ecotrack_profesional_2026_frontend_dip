<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack | Asignar pago inicial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="min-vh-100 d-flex flex-column">

    <div id="pantalla-carga">
        <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>

        <p class="mt-3 text-secondary fw-semibold">
            Cargando...
        </p>
    </div>

    <div id="site-header"></div>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">

            <div class="mb-4">
                <span class="badge text-bg-success mb-2">Gestión de solicitudes</span>
                <h2 class="fw-bold">Asignar pago inicial</h2>
                <p class="text-muted mb-0">
                    Registra la asignación inicial correspondiente a la solicitud seleccionada.
                </p>
            </div>

            <div id="mensaje-container"></div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">

                    <h5 class="fw-bold mb-4">Información de la asignación</h5>

                    <div class="mb-4">
                        <label class="form-label text-muted">Código de solicitud</label>
                        <p id="codigo-solicitud" class="fw-semibold mb-0">
                            Cargando...
                        </p>
                    </div>

                    <form id="form-asignacion">
                        <div class="mb-4">
                            <label for="monto-inicial" class="form-label">
                                Monto inicial
                            </label>

                            <div class="input-group">
                                <span class="input-group-text">S/</span>
                                <input
                                    type="number"
                                    class="form-control"
                                    id="monto-inicial"
                                    name="montoAsignadoInicial"
                                    min="0.01"
                                    step="0.01"
                                    placeholder="Ingrese el monto inicial"
                                    
                                >
                            </div>
                            <div class="form-text">
                                El monto debe ser mayor a cero.
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="/pages/solicitud/gestionarSolicitudesPendientes.html"
                               class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>

                            <button type="submit" id="btn-confirmar-asignacion"
                                    class="btn btn-success" disabled>
                                <i class="bi bi-check-circle me-1"></i>
                                Registrar asignación inicial
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/solicitud/asignarPagoInicial.js"></script>
</body>
</html>
