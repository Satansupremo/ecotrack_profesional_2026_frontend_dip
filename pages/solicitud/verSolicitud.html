
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoTrack | Ver solicitud</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="min-vh-100 d-flex flex-column">

    <div id="pantalla-carga">
        <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>

        <p class="mt-3 text-secondary fw-semibold">
            Cargando...
        </p>
    </div>

    <div id="site-header"></div>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <section class="container">

            <div class="mb-4">
                <a href="/pages/solicitud/gestionarMisSolicitudes.html"
                   class="text-decoration-none text-secondary">
                    <i class="bi bi-arrow-left me-1"></i>
                    Volver a mis solicitudes
                </a>

                <div class="mt-3">
                    <span class="badge text-bg-danger mb-2">
                        Detalle de solicitud
                    </span>

                    <h1 class="h2 fw-bold mb-1">Información de la solicitud</h1>

                    <p class="text-secondary mb-0">
                        Consulta los datos y el estado actual de tu solicitud.
                    </p>
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-12 col-lg-9">

                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body p-4 p-md-5">

                            <div id="mensaje-container"></div>

                            <div id="detalle-solicitud">

                                <div class="text-center py-5 text-secondary">
                                    <div class="spinner-border text-danger mb-3"></div>
                                    <p class="mb-0">Cargando información...</p>
                                </div>

                            </div>

                        </div>
                    </div>

                </div>
            </div>

        </section>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/solicitud/verSolicitud.js"></script>

</body>
</html>
