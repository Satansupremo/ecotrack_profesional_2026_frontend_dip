<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecotrack | Ver solicitud pendiente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="min-vh-100 d-flex flex-column">

    <div id="pantalla-carga">
        <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>

        <p class="mt-3 text-secondary fw-semibold">
            Cargando...
        </p>
    </div>

    <div id="site-header"></div>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">

            <div class="mb-4">
                <a href="/pages/solicitud/gestionarSolicitudesPendientes.html"
                   class="btn btn-outline-secondary btn-accion-cancelar">
                    <i class="bi bi-arrow-left me-1"></i>Volver
                </a>
            </div>

            <div class="mb-4">
                <span class="badge text-bg-primary mb-2">Gestión de solicitudes</span>
                <h2 class="fw-bold">Ver solicitud pendiente</h2>
                <p class="text-muted mb-0">
                    Consulta la información de la solicitud seleccionada.
                </p>
            </div>

            <div id="mensaje-container"></div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="fw-bold mb-0">Información de la solicitud</h5>
                        <span id="estado-solicitud" class="badge estado-badge" data-estado="PENDIENTE">
                            PENDIENTE
                        </span>
                    </div>

                    <div id="contenido-solicitud">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status"></div>
                            <p class="text-muted mt-2 mb-0">Cargando solicitud...</p>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/solicitud/verSolicitudPendiente.js"></script>
</body>
</html>
