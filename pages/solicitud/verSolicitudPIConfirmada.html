
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver solicitud PI confirmada - EcoTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <div id="pantalla-carga">
        <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>

        <p class="mt-3 text-secondary fw-semibold">
            Cargando...
        </p>
    </div>

    <div id="site-header"></div>

    <main class="container py-5">

        <div class="mb-4">
            <span class="badge bg-danger-subtle text-danger mb-2">
                Gestión de solicitudes
            </span>

            <h2 class="fw-bold text-dark">Ver solicitud PI confirmada</h2>

            <p class="text-secondary">
                Consulta la información del cliente y los detalles de la solicitud antes de realizar la asignación total.
            </p>
        </div>

        <div id="mensaje-container"></div>

        <!-- Información del cliente -->
        <div class="card border-0 shadow-sm mb-4">

            <div class="card-header bg-white py-3">
                <h5 class="fw-semibold mb-0">
                    <i class="bi bi-person text-danger me-2"></i>
                    Información del cliente
                </h5>
            </div>

            <div class="card-body">
                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="text-secondary small">Nombre completo</label>
                        <p class="fw-semibold mb-0" id="nombre-cliente">-</p>
                    </div>

                    <div class="col-md-6">
                        <label class="text-secondary small">Correo electrónico</label>
                        <p class="mb-0" id="correo-cliente">-</p>
                    </div>

                    <div class="col-md-6">
                        <label class="text-secondary small">Teléfono</label>
                        <p class="mb-0" id="telefono-cliente">-</p>
                    </div>

                </div>
            </div>
        </div>

        <!-- Información de la solicitud -->
        <div class="card border-0 shadow-sm mb-4">

            <div class="card-header bg-white py-3">
                <h5 class="fw-semibold mb-0">
                    <i class="bi bi-clipboard-check text-danger me-2"></i>
                    Información de la solicitud
                </h5>
            </div>

            <div class="card-body">
                <div class="row g-3">

                    <div class="col-md-4">
                        <label class="text-secondary small">Código de solicitud</label>
                        <p class="fw-semibold mb-0" id="id-solicitud">-</p>
                    </div>

                    <div class="col-md-8">
                        <label class="text-secondary small">Título</label>
                        <p class="fw-semibold mb-0" id="titulo-solicitud">-</p>
                    </div>

                    <div class="col-md-12">
                        <label class="text-secondary small">Descripción</label>
                        <p class="mb-0" id="descripcion-solicitud">-</p>
                    </div>

                    <div class="col-md-8">
                        <label class="text-secondary small">Ubicación</label>
                        <p class="mb-0" id="ubicacion-solicitud">-</p>
                    </div>

                    <div class="col-md-4">
                        <label class="text-secondary small">Fecha de registro</label>
                        <p class="mb-0" id="fecha-solicitud">-</p>
                    </div>

                    <div class="col-md-12">
                        <label class="text-secondary small">Estado</label>
                        <p class="mb-0">
                            <span class="badge estado-badge" id="estado-solicitud">-</span>
                        </p>
                    </div>

                </div>
            </div>
        </div>

        <!-- Acciones -->
        <div class="d-flex flex-wrap justify-content-end gap-2">

            <button type="button" class="btn btn-outline-secondary btn-accion-cancelar" id="cancelar">
                <i class="bi bi-arrow-left me-1"></i>
                Regresar
            </button>

            <a href="#" class="btn btn-danger btn-accion-registrar" id="asignar-total">
                <i class="bi bi-cash-stack me-1"></i>
                Asignar pago total
            </a>

        </div>

    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/solicitud/verSolicitudPIConfirmada.js"></script>

</body>
</html>
