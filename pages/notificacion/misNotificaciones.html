
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis notificaciones | EcoTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="min-vh-100 d-flex flex-column">

    <div id="pantalla-carga">
        <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>

        <p class="mt-3 text-secondary fw-semibold">
            Cargando...
        </p>
    </div>

    <div id="site-header"></div>

    <main class="flex-grow-1 d-flex align-items-center py-5">

        <section class="container">

            <div class="mx-auto" style="max-width: 850px;">

                <div class="mb-4 text-center">
                    <h2 class="fw-bold mb-1">
                        <i class="bi bi-bell me-2"></i>
                        Mis notificaciones
                    </h2>

                    <p class="text-muted mb-0">
                        Consulta las notificaciones de tu cuenta.
                    </p>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">

                        <div id="lista-notificaciones">
                            <div class="text-center py-5">
                                <div class="spinner-border text-success" role="status"></div>

                                <p class="text-muted mt-3 mb-0">
                                    Cargando notificaciones...
                                </p>
                            </div>
                        </div>

                    </div>
                </div>

                <nav class="mt-4" aria-label="Paginación de notificaciones">
                    <ul id="paginacion-notificaciones"
                        class="pagination justify-content-center">
                    </ul>
                </nav>

            </div>

        </section>

    </main>

    <div id="site-footer"></div>

    <!-- Modal de notificación -->
    <div class="modal fade" id="modal-notificacion" tabindex="-1"
        aria-labelledby="titulo-modal-notificacion" aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="titulo-modal-notificacion">
                        <i class="bi bi-bell me-2"></i>
                        Notificación
                    </h5>

                    <button type="button" class="btn-close"
                        data-bs-dismiss="modal" aria-label="Cerrar">
                    </button>
                </div>

                <div class="modal-body">
                    <p id="descripcion-notificacion" class="mb-0"></p>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Cerrar
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/notificacion/misNotificaciones.js"></script>

</body>

</html>
